const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = buf => [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2,'0')).join('');
async function sha(s){ return hex(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s))); }
async function deriveRaw(pw){
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64(P.salt), iterations:P.iter}, k, 256);
}
async function open(raw, user){
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
  try { sessionStorage.setItem('em_user', user); } catch(e) {}
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
// remembered login（等頁面載入完成後再寫入，避免 document.open 在解析中被忽略）
window.addEventListener('load', async () => {
  try {
    const s = JSON.parse(localStorage.getItem('em_auth') || 'null');
    if (s && s.salt === P.salt && s.exp > Date.now()) await open(b64(s.k), s.u);
    else if (s) localStorage.removeItem('em_auth');
  } catch(e) { try { localStorage.removeItem('em_auth'); } catch(_) {} }
});
document.getElementById('f').onsubmit = async ev => {
  ev.preventDefault();
  const e = document.getElementById('e'), b = document.getElementById('b');
  const u = document.getElementById('u').value.trim().toLowerCase();
  const p = document.getElementById('p').value;
  e.textContent = '';
  if (!P.users.includes(await sha(u))) { e.textContent = '使用者名稱或密碼錯誤'; return; }
  b.disabled = true; b.textContent = '登入中…';
  try {
    const raw = await deriveRaw(p);
    if (document.getElementById('rm').checked) {
      try { localStorage.setItem('em_auth', JSON.stringify({u, salt:P.salt, exp:Date.now()+30*86400000, k:btoa(String.fromCharCode(...new Uint8Array(raw)))})); } catch(_) {}
    }
    await open(raw, u);
  } catch(err) {
    e.textContent = '使用者名稱或密碼錯誤'; b.disabled = false; b.textContent = '登入';
    try { localStorage.removeItem('em_auth'); } catch(_) {}
  }
};
